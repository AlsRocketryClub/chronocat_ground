[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chronocat_ground"
version = "0.1.0"
description = "Qt chronocat_ground app for Chronocat telemetry and commands"
requires-python = ">=3.11,<3.14"
dependencies = []

[project.optional-dependencies]
gui = [
    "PySide6>=6.7",
]

[project.scripts]
chronocat_ground = "chronocat_ground.main:main"
chronocat_telemetry = "chronocat_ground.telemetry_cli:main"

[tool.setuptools.packages.find]
include = ["chronocat_ground*"]
